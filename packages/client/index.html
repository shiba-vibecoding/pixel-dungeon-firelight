<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#1f1d1d" />
    <title>Pixel Dungeon</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600&display=swap" rel="stylesheet" />
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
      :root {
        /* CSS pixels per pixel of the original art; set from the game. */
        --px: 1.5;
        --bg: #1f1d1d;
        --text: #e8e2c8;
      }
      html, body {
        margin: 0;
        height: 100%;
        background: var(--bg);
        overflow: hidden;
        overscroll-behavior: none;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
        -webkit-tap-highlight-color: transparent;
        font: 16px/1.3 'Pixelify Sans', ui-monospace, monospace;
        color: var(--text);
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
        image-rendering: pixelated;
      }
      #overlay {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: max(16px, env(safe-area-inset-top, 0px)) 16px max(16px, env(safe-area-inset-bottom, 0px));
        box-sizing: border-box;
        overflow-y: auto;
        touch-action: pan-y;
      }
      #overlay.dim {
        background: rgba(0, 0, 0, 0.55);
      }
      #overlay[hidden], #toast[hidden] {
        display: none;
      }
      .pd-title {
        display: flex;
        flex-direction: column;
        align-items: center;
        width: 100%;
        max-width: 380px;
        margin: auto;
      }
      .pd-banner {
        width: min(calc(128px * var(--px) * 2), 100%);
        aspect-ratio: 128 / 70;
        background: url(assets/banner-title.png) 0 0 / 100% 100% no-repeat;
        image-rendering: pixelated;
      }
      .pd-gameover {
        width: min(calc(128px * var(--px) * 1.5), 100%);
        aspect-ratio: 128 / 35;
        margin: 0 auto 4px;
        background: url(assets/banner-gameover.png) 0 0 / 100% 100% no-repeat;
        image-rendering: pixelated;
      }
      .pd-victory {
        width: min(calc(128px * var(--px) * 1.5), 100%);
        aspect-ratio: 128 / 35;
        margin: 0 auto 4px;
        background: url(assets/banner-boss.png) 0 0 / 100% 100% no-repeat;
        image-rendering: pixelated;
      }
      .pd-subtitle {
        margin: 2px 0 12px;
        color: #cacfc2;
        letter-spacing: 0.04em;
      }
      .pd-window {
        box-sizing: border-box;
        width: 100%;
        max-width: 380px;
        padding: calc(7px * var(--px) + 4px);
        border-style: solid;
        border-width: calc(7px * var(--px));
        border-image: url(assets/ui-window.png) 7 fill / calc(7px * var(--px)) stretch;
        image-rendering: pixelated;
        display: flex;
        flex-direction: column;
        gap: 8px;
        margin: auto;
      }
      .pd-button {
        font: inherit;
        color: #fff;
        background: none;
        border-style: solid;
        border-width: calc(2px * var(--px));
        border-image: url(assets/ui-button.png) 2 fill / calc(2px * var(--px)) stretch;
        image-rendering: pixelated;
        padding: 9px 10px;
        min-height: 44px;
        cursor: pointer;
        text-shadow: 0 1px 0 #000;
      }
      .pd-button:active {
        filter: brightness(1.3);
      }
      .pd-button.primary {
        font-weight: 600;
        color: #ffeba4;
      }
      .pd-heading {
        margin: 0;
        text-align: center;
        font-size: 1.15em;
        color: #ffeba4;
      }
      .pd-info, .pd-note {
        margin: 0;
        text-align: center;
        font-size: 0.9em;
      }
      .pd-note {
        color: #9a9a8a;
        font-size: 0.8em;
        margin-top: -4px;
      }
      .pd-classes {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 6px;
      }
      .pd-class {
        font: inherit;
        font-size: 0.8em;
        color: #cacfc2;
        background: rgba(0, 0, 0, 0.25);
        border: 2px solid transparent;
        border-radius: 3px;
        padding: 6px 2px 4px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 4px;
        cursor: pointer;
      }
      .pd-class.selected {
        border-color: #ffeba4;
        color: #ffeba4;
        background: rgba(255, 235, 164, 0.08);
      }
      .pd-class-icon {
        --s: calc(var(--px) * 2);
        width: calc(16px * var(--s));
        height: calc(16px * var(--s));
        background-image: url(assets/icons.png);
        background-size: calc(128px * var(--s)) calc(64px * var(--s));
        image-rendering: pixelated;
      }
      .icon-warrior { background-position: 0 calc(-29px * var(--s)); }
      .icon-mage { background-position: calc(-16px * var(--s)) calc(-29px * var(--s)); }
      .icon-rogue { background-position: calc(-32px * var(--s)) calc(-29px * var(--s)); }
      .icon-huntress { background-position: calc(-48px * var(--s)) calc(-29px * var(--s)); }
      .pd-input {
        font: inherit;
        color: #fff;
        background: rgba(0, 0, 0, 0.35);
        border: 1px solid #5c5a50;
        border-radius: 3px;
        padding: 8px 10px;
        user-select: text;
        -webkit-user-select: text;
      }
      .pd-help {
        margin: 0;
        padding-left: 1.1em;
        display: flex;
        flex-direction: column;
        gap: 6px;
        font-size: 0.9em;
      }
      .pd-row {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .pd-row .pd-heading {
        flex: 1;
        text-align: left;
      }
      .pd-row.equipped .pd-slot {
        width: 25%;
      }
      .pd-grid {
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        gap: 4px;
      }
      .pd-slot {
        position: relative;
        aspect-ratio: 1;
        display: grid;
        place-items: center;
        padding: 0;
        font: inherit;
        color: #fff;
        background: rgba(0, 0, 0, 0.3);
        border: 1px solid #5c5a50;
        border-radius: 3px;
        cursor: pointer;
      }
      .pd-slot.empty {
        cursor: default;
        opacity: 0.5;
      }
      .pd-item {
        --s: calc(var(--px) * 1.75);
        display: inline-block;
        width: calc(16px * var(--s));
        height: calc(16px * var(--s));
        background-image: url(assets/items.png);
        background-size: calc(128px * var(--s)) calc(256px * var(--s));
        image-rendering: pixelated;
      }
      .pd-qty, .pd-lvl, .pd-tag {
        position: absolute;
        font-size: 0.7em;
        text-shadow: 0 1px 0 #000, 1px 0 0 #000;
      }
      .pd-qty { right: 3px; bottom: 1px; }
      .pd-lvl { left: 3px; top: 1px; }
      .pd-lvl.up { color: #44ff44; }
      .pd-lvl.down { color: #ff6666; }
      .pd-tag { left: 0; right: 0; bottom: 1px; text-align: center; color: #ffeba4; }
      .pd-gold {
        display: flex;
        align-items: center;
        gap: 2px;
        color: #ffeba4;
      }
      .pd-gold .pd-item { --s: var(--px); }
      .pd-stats { flex: 1; text-align: right; color: #cacfc2; }
      .pd-offer {
        flex: 1;
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .pd-offer .pd-note { text-align: left; margin: 0; }
      .pd-row > .pd-slot { width: 22%; flex: none; }
      .pd-board {
        margin: 0;
        padding-left: 1.6em;
        display: flex;
        flex-direction: column;
        gap: 4px;
        font-size: 0.9em;
      }
      .pd-board .what {
        float: right;
        color: #ffeba4;
      }
      .pd-board li.me {
        color: #44ff44;
      }
      #toast {
        position: fixed;
        left: 50%;
        top: calc(48px * var(--px) + env(safe-area-inset-top));
        transform: translateX(-50%);
        padding: 8px 14px;
        border-style: solid;
        border-width: calc(5px * var(--px));
        border-image: url(assets/ui-toast.png) 5 fill / calc(5px * var(--px)) stretch;
        image-rendering: pixelated;
        white-space: nowrap;
        pointer-events: none;
      }
      /* Measures the safe areas (iPhone notch and home indicator, Telegram's own bars). */
      #safe-area {
        position: fixed;
        inset: 0;
        visibility: hidden;
        pointer-events: none;
        padding-top: max(env(safe-area-inset-top, 0px), calc(var(--tg-safe-area-inset-top, 0px) + var(--tg-content-safe-area-inset-top, 0px)));
        padding-bottom: max(env(safe-area-inset-bottom, 0px), calc(var(--tg-safe-area-inset-bottom, 0px) + var(--tg-content-safe-area-inset-bottom, 0px)));
      }
      #loading {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        color: #9a9a8a;
      }
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>
    <div id="overlay" hidden></div>
    <div id="toast" hidden></div>
    <div id="safe-area"></div>
    <div id="loading">…</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
