<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Firelight doors</title>
<style>
@font-face { font-family: G11; src: url(fonts/Galmuri11.woff2); } @font-face { font-family: G9; src: url(fonts/Galmuri9.woff2); }
:root { --void:#0b0b09; --s9:#1f211c; --s8:#282a24; --s7:#3b3e36; --s3:#7a8173; --ink:#e8e2c8; --mut:#b0b5a3; --light:#ffeba4; --gold:#ffcc66; --flame:#ff9a3a; --litdark:#4a3424; --ally:#5ec8c0; }
* { box-sizing: border-box; } html, body { margin: 0; background: var(--void); color: var(--ink); font: 14px/1.4 G9, monospace; -webkit-font-smoothing: none; }
canvas { image-rendering: pixelated; display: block; max-width: 100%; }
#app { padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.top { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; border-bottom: 2px solid var(--litdark); padding-bottom: 8px; }
.top h1 { margin: 0; font: 26px/1.1 G11; color: var(--light); text-shadow: 2px 2px 0 #1a0a06; } .top span { color: var(--mut); }
.card { background: var(--s9); border: 2px solid var(--s8); border-bottom-color: var(--litdark); padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.card h2 { margin: 0; font: 18px/1.2 G11; color: var(--light); font-weight: 400; display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
.card h2 small { font: 13px G9; color: var(--s3); }
.row { display: flex; gap: 12px; flex-wrap: wrap; align-items: flex-start; }
.strip { background: #121310; padding: 6px; overflow-x: auto; max-width: 100%; }
p { margin: 0; color: var(--mut); } p b { color: var(--gold); font-weight: 400; }
ul { margin: 0; padding-left: 18px; color: var(--mut); } li b { color: var(--ink); font-weight: 400; }
.tag { display: inline-block; padding: 0 6px; background: var(--s7); color: var(--gold); font: 12px/18px G9; margin-left: 4px; }
.tag.sym { color: var(--ally); }
.grid2 { display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: 10px; }
.mobs { display: flex; flex-wrap: wrap; gap: 6px; }
.mob { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 4px 6px; background: #121310; font: 12px G9; color: var(--mut); min-width: 60px; }
</style></head><body><div id="app"></div><script type="module" src="sheet.js"></script></body></html>
