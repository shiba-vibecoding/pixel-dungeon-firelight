<!doctype html>
<html>
<head><meta charset="utf-8"><title>Итоги с местами</title>
<style>
  html, body { margin: 0; background: var(--void); }
  .row { display: flex; gap: 24px; }
  .phone { position: relative; width: 375px; height: 812px; overflow: hidden; --safe-t: 0px; --safe-b: 34px; flex: none; }
</style></head>
<body>
<div class="pd-root row" id="row"></div>
<script>
  var q = new URLSearchParams(location.search), L = q.get("lang") || "ru";
  function phone() { var p = document.createElement("div"); p.className = "phone pd-phone"; document.getElementById("row").appendChild(p); return p; }
  function end(p, st) { PD.demo.map(p.appendChild(Object.assign(document.createElement("canvas"), { style: "position:absolute;inset:0;width:100%;height:100%;filter:grayscale(.8)" })), { names: false });
    var en = L === "en", T = PD.demo.rankedT[L];
    PD.demo.overlay(p, "<section class=\"pd-window pd-runend\" role=\"dialog\"><h2 class=\"pd-display\">" + (en ? "You died" : "Вы погибли") + "</h2><p class=\"pd-cause\">" + (en ? "Killed by a gnoll shaman on depth 9" : "Убиты гноллом-шаманом на глубине 9") + "</p><dl class=\"pd-stats\"><div><dt>" + (en ? "Depth" : "Глубина") + "</dt><dd>9</dd></div><div><dt>" + (en ? "Score" : "Очки") + "</dt><dd class=\"gold\">4 320</dd></div><div><dt>" + (en ? "Foes defeated" : "Побеждено врагов") + "</dt><dd>61</dd></div></dl>" + (st === "checked" ? PD.demo.rankingBlock(L, "checked") : PD.demo.rankingBlock(L, "checking") + PD.demo.rankingBlock(L, "unchecked")) + "<div class=\"pd-actions\"><button class=\"pd-button primary\">" + (en ? "Share" : "Поделиться") + "</button><button class=\"pd-button\">" + T.rating + "</button><button class=\"pd-button quiet\">" + (en ? "Main menu" : "Главное меню") + "</button></div></section>"); }
  end(phone(), "checked"); end(phone(), "pending");
  PD.sprite(document.body);
</script>
</body>
</html>
