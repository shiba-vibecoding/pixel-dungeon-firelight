<!doctype html>
<html>
<head><meta charset="utf-8"><title>Журнал</title>
<style>
  html, body { margin: 0; background: var(--void); }
  .pair { display: flex; gap: 40px; width: 820px; }
  .phone { position: relative; width: 390px; height: 844px; overflow: hidden; --safe-t: 0px; --safe-b: 34px; }
</style></head>
<body>
<div class="pd-root pair">
  <div class="phone" id="p1"></div>
  <div class="phone" id="p2"></div>
</div>
<script>
  var p1 = document.getElementById('p1'), p2 = document.getElementById('p2');
  PD.demo.game(p1, { depth: 6, mates: false }); PD.demo.game(p2, { depth: 6, mates: false });
  PD.demo.overlay(p1, PD.demo.win.journal('ru')); PD.demo.overlay(p2, PD.demo.win.journal('ru', { catalog: true, sel: 6 }));
  PD.sprite(document.body);
</script>
</body>
</html>
