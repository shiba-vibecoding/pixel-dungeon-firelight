<!doctype html>
<html>
<head><meta charset="utf-8"><title>Титул с рейтингом</title>
<style>
  html, body { margin: 0; background: var(--void); }
  .row { display: flex; gap: 24px; }
  .phone { position: relative; width: 375px; height: 812px; overflow: hidden; --safe-t: 0px; --safe-b: 34px; flex: none; }
</style></head>
<body>
<div class="pd-root row" id="row"></div>
<script>
  var q = new URLSearchParams(location.search), L = q.get("lang") || "ru";
  function phone() { var p = document.createElement("div"); p.className = "phone pd-phone"; document.getElementById("row").appendChild(p); return p; }
  PD.demo.titleRanked(phone(), { lang: L, daily: "open", streak: 12, frost: 1, trophies: 3 });
  PD.demo.titleRanked(phone(), { lang: L, daily: "done", streak: 13, frost: 1, trophies: 3, place: 8 });
  PD.demo.titleRanked(phone(), { lang: L, daily: "open", streak: 0, fresh: true });
  PD.sprite(document.body);
</script>
</body>
</html>
